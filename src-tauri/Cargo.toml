[package]
name = "ade"
version = "0.1.0"
description = "ADE — macOS desktop app for creator economy commission management"
authors = ["mk"]
edition = "2021"

[lib]
name = "ade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

