[package]
name = "ade"
version = "0.1.0"
description = "ADE — macOS desktop app for creator economy commission management"
authors = ["mk"]
edition = "2021"

[lib]
name = "ade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
tokio = { version = "1.52.3", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
octocrab = "0.53.1"
git2 = "0.21.0"
keyring = "4.0.1"
toml = "1.1.2"
thiserror = "2.0.18"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
keyring-core = "1.0.0"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

